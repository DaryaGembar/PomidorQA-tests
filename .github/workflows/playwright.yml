name: Playwright CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      start_ts: ${{ steps.run-start.outputs.ts }}
    steps:
      - name: Note run start time
        id: run-start
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint tests
        run: npm run lint

  unit:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        env:
          CI: true

  api:
    name: API tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api
        env:
          CI: true

  e2e:
    name: E2E tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Publish test report to PR
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Playwright Report
          path: results.xml
          reporter: jest-junit
          fail-on-error: false

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: results-xml
          path: results.xml
          retention-days: 1

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            allure-results/
            test-results/
          retention-days: 14

  notify:
    name: Notify Telegram
    needs: [unit, api, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download e2e junit results
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: results-xml
          path: .

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          UNIT_RESULT: ${{ needs.unit.result }}
          API_RESULT: ${{ needs.api.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          COMMITTER: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}

          RUN_START_TS: ${{ needs.lint.outputs.start_ts }}
        run: |
          # Totals из junit-XML куба E2E. Если файла нет — нули, сообщение уйдёт.
          if [ -f results.xml ]; then
            TOTAL=$(grep -oE 'tests="[0-9]+"' results.xml | head -1 | grep -oE '[0-9]+')
            FAILURES=$(grep -oE 'failures="[0-9]+"' results.xml | head -1 | grep -oE '[0-9]+')
            SKIPPED=$(grep -oE 'skipped="[0-9]+"' results.xml | head -1 | grep -oE '[0-9]+')
            PASSED=$((TOTAL - FAILURES - SKIPPED))
          else
            TOTAL=0; FAILURES=0; SKIPPED=0; PASSED=0
          fi

          RUN_START_TS=${RUN_START_TS:-$(date +%s)}
          ELAPSED=$(( $(date +%s) - RUN_START_TS ))
          if (( ELAPSED < 0 )); then ELAPSED=0; fi
          DURATION_FMT="$((ELAPSED / 60)) мин $((ELAPSED % 60)) с"

          # Пайплайн зелёный, только если зелёные все три тестовых куба.
          if [ "$UNIT_RESULT" = "success" ] && [ "$API_RESULT" = "success" ] && [ "$E2E_RESULT" = "success" ]; then
            EMOJI="✅"; HEAD="Пайплайн зелёный"
          else
            EMOJI="❌"; HEAD="Пайплайн красный"
          fi

          COMMIT_URL="https://github.com/${REPO}/commit/${COMMIT_SHA}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          TEXT="${EMOJI} *${HEAD}*
          📦 Репозиторий: ${REPO}
          🌿 Ветка: ${BRANCH}
          👤 Запустил: ${COMMITTER}
          🧪 Unit: ${UNIT_RESULT} | API: ${API_RESULT} | E2E: ${E2E_RESULT}
          📊 E2E: Всего ${TOTAL} | ✅ ${PASSED} | ❌ ${FAILURES} | ⏭ ${SKIPPED}
          ⏱ Время прогона: ${DURATION_FMT}
          🔗 [Прогон в GitHub](${RUN_URL})
          💬 [Коммит](${COMMIT_URL})"

          curl --fail -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="${TEXT}"
