name: Playwright CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      start_ts: ${{ steps.run-start.outputs.ts }}
    steps:
      - name: Note run start time
        id: run-start
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint tests
        run: npm run lint

  unit:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      start_ts: ${{ steps.run-start.outputs.ts }}
    steps:
      - name: Note run start time
        id: run-start
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        env:
          CI: true

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-unit
          path: allure-results/
          retention-days: 1
          if-no-files-found: ignore

  api:
    name: API tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      start_ts: ${{ steps.run-start.outputs.ts }}
    steps:
      - name: Note run start time
        id: run-start
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api
        env:
          CI: true

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-api
          path: allure-results/
          retention-days: 1
          if-no-files-found: ignore

  e2e:
    name: E2E tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      start_ts: ${{ steps.run-start.outputs.ts }}
    steps:
      - name: Note run start time
        id: run-start
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-e2e
          path: allure-results/
          retention-days: 1
          if-no-files-found: ignore

      - name: Publish test report to PR
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Playwright Report
          path: results.xml
          reporter: jest-junit
          fail-on-error: false

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: results-xml
          path: results.xml
          retention-days: 1

      - name: Upload failure screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: failure-screenshots
          path: test-results/**/test-failed-*.png
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            allure-results/
            test-results/
          retention-days: 14

  notify:
    name: Notify Telegram
    needs: [unit, api, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download e2e junit results
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: results-xml
          path: .

      - name: Download failure screenshots
        if: ${{ needs.e2e.result == 'failure' }}
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: failure-screenshots
          path: test-results

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          UNIT_RESULT: ${{ needs.unit.result }}
          API_RESULT: ${{ needs.api.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          COMMITTER: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}

          LINT_START_TS: ${{ needs.lint.outputs.start_ts }}
          UNIT_START_TS: ${{ needs.unit.outputs.start_ts }}
          API_START_TS: ${{ needs.api.outputs.start_ts }}
          E2E_START_TS: ${{ needs.e2e.outputs.start_ts }}
        run: bash scripts/notify-telegram.sh --send

  allure-report:
    name: Allure report
    needs: [unit, api, e2e]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v7
        with:
          name: allure-unit
          path: allure-results
          merge-multiple: true

      - name: Download Allure results (api)
        uses: actions/download-artifact@v7
        with:
          name: allure-api
          path: allure-results
          merge-multiple: true

      - name: Download Allure results (e2e)
        uses: actions/download-artifact@v7
        with:
          name: allure-e2e
          path: allure-results
          merge-multiple: true

      - name: Restore Allure history
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy Allure history
        run: |
          mkdir -p allure-results/history
          if [ -d gh-pages/allure-report/history ]; then
            cp -r gh-pages/allure-report/history/. allure-results/history/
          fi

      - name: Generate Allure report
        run: npx allure-commandline@2 generate allure-results --clean -o allure-report

      - name: Publish Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
